<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>devbox</title>
<style>
  :root {
    --bg: #0f1117; --panel: #181b24; --panel2: #1f2330; --line: #2b3040;
    --text: #e8eaf0; --muted: #8b93a7;
    --purple: #a78bfa; --blue: #60a5fa; --cyan: #22d3ee; --green: #4ade80;
    --orange: #fb923c; --pink: #f472b6; --red: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.5; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 24px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 20px; letter-spacing: .5px;
    background: linear-gradient(90deg, var(--purple), var(--cyan), var(--green));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  main { max-width: 960px; margin: 0 auto; padding: 24px; display: grid; gap: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input, textarea { width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font: inherit; }
  textarea { font-family: ui-monospace, Menlo, monospace; font-size: 13px; min-height: 90px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--blue); border-color: transparent; }
  .row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .row { grid-template-columns: 1fr; } header, main { padding: 14px; } }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px; }
  button:hover { border-color: var(--blue); }
  button.primary { background: linear-gradient(90deg, var(--purple), var(--blue)); border: 0; color: #0b0d12; font-weight: 600; }
  button.danger:hover { border-color: var(--red); color: var(--red); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .proj-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: space-between; }
  .proj-name { font-weight: 600; font-size: 16px; }
  .meta { color: var(--muted); font-size: 13px; word-break: break-all; }
  .badge { font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; }
  .s-running { color: var(--green); } .s-building { color: var(--orange); }
  .s-failed { color: var(--red); } .s-stopped, .s-created { color: var(--muted); }
  .s-queued { color: var(--purple); }
  .info { color: var(--muted); font-size: 13px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  a.preview { color: var(--cyan); text-decoration: none; font-size: 14px; }
  a.preview:hover { text-decoration: underline; }
  pre.log { margin: 12px 0 0; background: #0a0c11; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; max-height: 320px; overflow: auto; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
  .err { color: var(--red); font-size: 13px; margin-top: 8px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .empty { color: var(--muted); text-align: center; padding: 24px; }
  a.btn { display: inline-block; text-decoration: none; border-radius: 8px; padding: 8px 16px; font-size: 14px;
    background: linear-gradient(90deg, var(--purple), var(--blue)); color: #0b0d12; font-weight: 600; }
  .user { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .user img { width: 24px; height: 24px; border-radius: 50%; }
  .notice { border-color: var(--orange); }
  .quota { color: var(--muted); font-size: 12px; margin-top: 6px; }
  /* 全画面の警告。見逃さないように、画面全体を覆って、赤く脈打つ */
  .modal-bg { position: fixed; inset: 0; background: #2a0d10; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100; animation: alert-pulse 1s ease-in-out infinite; overflow: auto; }
  .modal-bg[hidden] { display: none; }
  @keyframes alert-pulse { 0%, 100% { background: #2a0d10; box-shadow: inset 0 0 0 10px var(--red); } 50% { background: #4a1216; box-shadow: inset 0 0 0 10px var(--orange); } }
  @media (prefers-reduced-motion: reduce) { .modal-bg { animation: none; box-shadow: inset 0 0 0 10px var(--red); } }
  .modal { text-align: center; width: 100%; max-width: 560px; }
  .modal .warn { font-size: 64px; line-height: 1; }
  .modal h2 { margin: 8px 0; font-size: 32px; }
  .modal .count { font-size: 72px; font-weight: 800; color: var(--orange); margin: 8px 0; font-variant-numeric: tabular-nums; }
  .modal .meta, .modal .hint { font-size: 15px; }
  .modal button { font-size: 18px; padding: 14px 28px; }
  .modal .actions { justify-content: center; }
  .notify-btn { font-size: 12px; padding: 4px 10px; }
  .timers { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .timer { font-size: 13px; color: var(--cyan); background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-variant-numeric: tabular-nums; }
  .timer.warn { color: var(--orange); border-color: var(--orange); }
  /* 広告を出すときの場所。今は空 */
  .ad-slot { min-height: 0; margin: 10px 0; }
  .modal .actions { display: flex; gap: 10px; margin-top: 12px; }
</style>
</head>
<body>
<div class="modal-bg" id="confirm-modal" hidden role="alertdialog" aria-labelledby="confirm-title">
  <div class="modal">
    <div class="warn" aria-hidden="true">⚠️</div>
    <h2 id="confirm-title">まだ使っていますか?</h2>
    <div id="confirm-name" class="meta"></div>
    <div class="count" id="confirm-count"></div>
    <div class="hint">押さないと、そのまま停止します(データはリポジトリから取り直せます)。</div>
    <div class="ad-slot" id="ad-slot"></div>
    <div id="ts-box"></div>
    <div class="err" id="confirm-err"></div>
    <div class="actions">
      <button class="primary" id="confirm-ok" disabled>続ける</button>
      <button id="confirm-stop">停止する</button>
    </div>
  </div>
</div>
<header>
  <h1>devbox</h1>
  <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <span class="info" id="info"></span>
    <button class="notify-btn" id="notify-btn" hidden title="確認が出たときに、別のタブを見ていても、デスクトップ通知でお知らせします">🔔 通知をオンにする</button>
    <span class="user" id="user" hidden><img id="user-img" alt="" hidden><span id="user-name"></span></span>
    <button id="logout" hidden>ログアウト</button>
  </div>
</header>
<main>
  <section class="card" id="login" hidden>
    <strong>devbox へようこそ</strong>
    <p class="meta">GitHub のリポジトリとブランチを指定すると、開発用のサーバーが立ち上がって、プレビューのURLが発行されます。</p>
    <div class="actions"><a class="btn" href="/auth/github">GitHub でログイン</a></div>
    <div class="hint">ログインに使うのは、GitHub のユーザー名とアイコンだけです。リポジトリへのアクセス権は求めません。</div>
  </section>

  <section class="card notice" id="gate" hidden>
    <strong id="gate-title"></strong>
    <p class="meta" id="gate-msg"></p>
  </section>

  <section class="card" id="create" hidden>
    <strong>新しい開発サーバー</strong>
    <div class="row">
      <div><label>名前</label><input id="f-name" maxlength="40" placeholder="my-app"></div>
      <div><label>ブランチ</label><input id="f-branch" value="main"></div>
      <div><label>ポート(アプリが待ち受ける)</label><input id="f-port" type="number" value="3000"></div>
    </div>
    <label>リポジトリURL</label>
    <input id="f-repo" placeholder="https://github.com/owner/repo">
    <label>環境変数 (1行に KEY=VALUE)</label>
    <textarea id="f-env" placeholder="DATABASE_URL=...&#10;API_KEY=..."></textarea>
    <div class="hint">PORT / HOST は devbox が設定します。値は暗号化して保存され、画面には表示されません。</div>
    <div class="actions"><button class="primary" id="create-btn">作成して起動</button></div>
    <div class="err" id="create-err"></div>
  </section>

  <section id="list" hidden></section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const openLogs = new Map(); // id -> { type, offset, text }
let me = null;

function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of children.flat()) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
}

// ログインは Cookie (HttpOnly) で行う。ブラウザが自動で付けるので、画面側でトークンは持たない。
async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    ...opts,
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { showLogin(); throw new Error('unauthorized'); }
  if (res.status === 403 && (data.code === 'pending' || data.code === 'suspended')) {
    boot(); // 状態が変わった(凍結された、など)ので、表示を作り直す
    throw new Error(data.error);
  }
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function parseEnv(text) {
  const env = {};
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line || line.startsWith('#')) continue;
    const i = line.indexOf('=');
    if (i < 1) throw new Error(`環境変数の形式が不正です: ${line.slice(0, 30)}`);
    env[line.slice(0, i).trim()] = line.slice(i + 1);
  }
  return env;
}

function show(view) { // view: 'login' | 'gate' | 'app'
  $('login').hidden = view !== 'login';
  $('gate').hidden = view !== 'gate';
  $('create').hidden = view !== 'app';
  $('list').hidden = view !== 'app';
  $('logout').hidden = view === 'login';
  $('user').hidden = view === 'login';
  if (view !== 'app') $('info').textContent = '';
}

function showLogin() { clearTimeout(timer); clearTimeout(gateTimer); me = null; show('login'); }

function setUser(u) {
  $('user-name').textContent = u.login;
  const img = $('user-img');
  if (u.avatarUrl) { img.src = u.avatarUrl; img.hidden = false; } else img.hidden = true;
}

// 使っている量 / 上限 の表示
function showUsage(i) {
  const u = me.usage, l = me.limits;
  $('info').textContent =
    `プロジェクト ${u.projects}/${l.maxProjects} ・ 同時起動 ${u.running}/${l.maxRunning}` +
    (i ? ` ・ 全体の稼働 ${i.active}/${i.maxRunning}` : '') +
    (i && i.maxRuntimeHours ? ` ・ 最大${i.maxRuntimeHours}時間で自動停止` : '') +
    (i && i.keepaliveMinutes ? ` ・ ${i.keepaliveMinutes}分ごとに「まだ使っていますか?」の確認` : '') +
    (i && i.idleStopMinutes ? ` ・ ${i.idleStopMinutes}分間アクセスがないと自動停止` : '');
}

let gateTimer = null;
async function boot() {
  clearTimeout(gateTimer);
  const res = await fetch('/api/me', { credentials: 'same-origin' });
  if (res.status === 401) return showLogin();
  me = await res.json();
  setUser(me);
  if (me.status === 'approved') {
    show('app');
    try { await refresh(); } catch { /* 401 は api() が処理する */ }
    return;
  }
  clearTimeout(timer);
  show('gate');
  if (me.status === 'pending') {
    $('gate-title').textContent = '承認待ちです';
    $('gate-msg').textContent = 'GitHub でのログインは完了しました。管理者が承認すると、開発サーバーを作れるようになります。このページは、承認されると自動で切り替わります。';
    gateTimer = setTimeout(boot, 15000); // 承認されたかを、定期的に確認する
  } else {
    $('gate-title').textContent = 'このアカウントは利用できません';
    $('gate-msg').textContent = '管理者によって、利用が止められています。心当たりがなければ、管理者に連絡してください。';
  }
}

$('logout').onclick = async () => {
  try { await fetch('/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch { /* 画面は戻す */ }
  location.reload();
};

$('create-btn').onclick = async () => {
  $('create-err').textContent = '';
  try {
    const p = await api('/projects', { method: 'POST', body: {
      name: $('f-name').value, repoUrl: $('f-repo').value, branch: $('f-branch').value,
      port: $('f-port').value, env: parseEnv($('f-env').value),
    }});
    $('f-name').value = ''; $('f-repo').value = ''; $('f-env').value = '';
    openLogs.set(p.id, { type: 'build', offset: 0, text: '' });
    await refresh();
  } catch (e) { $('create-err').textContent = e.message; }
};

async function act(id, fn) {
  try { await fn(); } catch (e) { alert(e.message); }
  await refresh();
}

// ---- いつも出しておくタイマー --------------------------------------------------
// サーバーからは「あと何秒」だけをもらい、画面側で1秒ごとに減らす(一覧を作り直すたびに、基準を取り直す)
const fmtSec = (sec) => {
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
};
let nextConfirmUntil = null; // タブのタイトルに出す、いちばん近い確認の時刻

function timerSpan(label, sec, warnUnder) {
  const until = Date.now() + sec * 1000;
  return el('span', { class: 'timer', 'data-until': String(until), 'data-label': label, 'data-warn': String(warnUnder) }, '');
}

function timersFor(p) {
  if (p.status !== 'running') return '';
  const parts = [];
  if (p.confirmSecondsLeft != null) parts.push(el('span', { class: 'timer warn' }, '⚠ 確認待ち'));
  else if (p.secondsToConfirm != null) {
    parts.push(timerSpan('⏱ 次の確認まで', p.secondsToConfirm, 60));
    const u = Date.now() + p.secondsToConfirm * 1000;
    if (nextConfirmUntil === null || u < nextConfirmUntil) nextConfirmUntil = u;
  }
  if (p.runtimeSecondsLeft != null) parts.push(timerSpan('⏳ 最大稼働まで', p.runtimeSecondsLeft, 300));
  return parts.length ? el('div', { class: 'timers' }, ...parts) : '';
}

function tickTimers() {
  for (const t of document.querySelectorAll('.timer[data-until]')) {
    const left = Math.max(0, Math.ceil((Number(t.dataset.until) - Date.now()) / 1000));
    t.textContent = `${t.dataset.label} ${fmtSec(left)}`;
    t.classList.toggle('warn', left <= Number(t.dataset.warn));
  }
  // 確認の警告が出ていないときは、タブのタイトルに、次の確認までを出す(別のタブを見ていても分かる)
  if ($('confirm-modal').hidden) {
    document.title = nextConfirmUntil === null
      ? baseTitle
      : `⏱ ${fmtSec(Math.max(0, Math.ceil((nextConfirmUntil - Date.now()) / 1000)))} - ${baseTitle}`;
  }
}
setInterval(tickTimers, 1000);

// 起動・再ビルドのボタン。rebuild なら、コンテナを作り直す(書き込んだデータが消える)
function startBtn(p, rebuild, label, warn) {
  return el('button', {
    disabled: p.busy || p.status === 'building' || p.status === 'queued',
    onclick: () => {
      if (warn && !confirm('ビルドからやり直すと、コンテナの中に書き込んだデータが消えます。続けますか?')) return;
      act(p.id, async () => {
        await api(`/projects/${p.id}/start`, { method: 'POST', body: { rebuild } });
        openLogs.set(p.id, { type: 'build', offset: 0, text: '' });
      });
    },
  }, label);
}

function render(projects) {
  nextConfirmUntil = null;
  const list = $('list');
  list.replaceChildren();
  if (projects.length === 0) { list.append(el('div', { class: 'card empty' }, 'まだプロジェクトがありません')); return; }
  list.style.display = 'grid'; list.style.gap = '14px';
  for (const p of projects) {
    const logState = openLogs.get(p.id);
    const logBox = el('pre', { class: 'log', id: 'log-' + p.id, hidden: !logState }, logState?.text || '');
    list.append(el('div', { class: 'card' },
      el('div', { class: 'proj-head' },
        el('div', {},
          el('div', { class: 'proj-name' }, p.name),
          el('div', { class: 'meta' }, `${p.repoUrl} @ ${p.branch} : ${p.port}`),
          p.cpuMs ? el('div', { class: 'meta' }, `CPU時間 ${p.cpuMs.toLocaleString()} ms`) : '',
          timersFor(p)),
        el('span', { class: 'badge s-' + p.status }, { created: '未起動', queued: p.queuePosition ? `待機中 (${p.queuePosition}番目)` : '待機中', building: 'ビルド中', running: '実行中', stopped: '停止', failed: '失敗' }[p.status] || p.status)),
      p.status === 'running' ? el('div', { style: 'margin-top:8px' }, el('a', { class: 'preview', href: p.previewUrl, target: '_blank', rel: 'noopener noreferrer' }, p.previewUrl)) : '',
      p.envKeys.length ? el('div', { class: 'hint' }, 'env: ' + p.envKeys.join(', ')) : '',
      p.resumable ? el('div', { class: 'hint' }, '停止中です。書き込んだデータは残っていて、「起動」でそのまま再開できます(再ビルドすると消えます)') : '',
      p.needsRebuild ? el('div', { class: 'hint' }, '設定を変えたので、次の起動はビルドからになり、書き込んだデータは消えます') : '',
      p.error ? el('div', { class: 'err' }, p.error) : '',
      el('div', { class: 'actions' },
        ...(p.status === 'running'
          ? [startBtn(p, true, '再ビルド', true)]
          : p.resumable
            ? [startBtn(p, false, '起動'), startBtn(p, true, '再ビルド', true)]
            : [startBtn(p, false, p.needsRebuild ? '起動(再ビルド)' : '起動', p.needsRebuild)]),
        el('button', { disabled: !(p.status === 'running' || p.status === 'queued') || p.busy, onclick: () => act(p.id, () => api(`/projects/${p.id}/stop`, { method: 'POST' })) }, p.status === 'queued' ? '待機をやめる' : '停止'),
        el('button', { onclick: () => { openLogs.set(p.id, { type: 'build', offset: 0, text: '' }); refresh(); } }, 'ビルドログ'),
        el('button', { disabled: p.status !== 'running', onclick: async () => { const r = await api(`/projects/${p.id}/runtime-log`); openLogs.set(p.id, { type: 'runtime', offset: 0, text: r.text || '(ログなし)' }); refresh(); } }, '実行ログ'),
        el('button', { disabled: p.busy || p.status === 'building', onclick: () => act(p.id, async () => {
          const t = prompt('環境変数を全て入力し直してください (KEY=VALUE を改行区切り)。空欄で全削除。\n現在のキー: ' + p.envKeys.join(', '), '');
          if (t === null) return;
          await api(`/projects/${p.id}`, { method: 'PATCH', body: { env: parseEnv(t) } });
          alert('保存しました。反映するには「再ビルド」してください。');
        }) }, 'env編集'),
        el('button', { class: 'danger', disabled: p.busy, onclick: () => { if (confirm(`「${p.name}」を削除しますか？`)) act(p.id, () => api(`/projects/${p.id}`, { method: 'DELETE' })); } }, '削除')),
      logBox));
  }
}

// ---- 「まだ使っていますか?」の確認 -----------------------------------------------
const cf = { id: null, widget: null, token: null, deadline: 0, siteKey: '', countTimer: null };
const baseTitle = document.title;

function loadTurnstile() {
  if (window.turnstile) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
    s.async = true; s.onload = resolve; s.onerror = reject;
    document.head.append(s);
  });
}

function fmtLeft() {
  const left = Math.max(0, Math.ceil((cf.deadline - Date.now()) / 1000));
  return `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
}

// 音(最初に画面を触ったあとでないと、ブラウザが鳴らさせてくれない)
let audio = null;
document.addEventListener('pointerdown', () => {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch { /* 音なしで動かす */ }
}, { once: true });
function beep() {
  if (!audio || audio.state !== 'running') return;
  for (const [i, hz] of [880, 660, 880].entries()) {
    const t = audio.currentTime + i * 0.22;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'square'; o.frequency.value = hz;
    g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.2);
  }
}

// 別のタブを見ているとき用のデスクトップ通知(許可されているときだけ)
let note = null;
function notifyConfirm(p) {
  if (!('Notification' in window) || Notification.permission !== 'granted' || !document.hidden) return;
  try {
    note = new Notification('⚠ まだ使っていますか?', {
      body: `「${p.name}」は、あと ${fmtLeft()} で停止します。押して確認してください`,
      tag: 'devbox-confirm', requireInteraction: true,
    });
    note.onclick = () => { window.focus(); note.close(); };
  } catch { /* 通知なしで動かす */ }
}

function updateNotifyBtn() {
  const b = $('notify-btn');
  b.hidden = !('Notification' in window) || Notification.permission !== 'default';
}
$('notify-btn').onclick = async () => {
  try { await Notification.requestPermission(); } catch { /* 許可されなければ、そのまま */ }
  updateNotifyBtn();
};
updateNotifyBtn();

let flash = false;
function tickCount() {
  $('confirm-count').textContent = `あと ${fmtLeft()}`;
  if (!$('confirm-modal').hidden) {
    flash = !flash;
    document.title = flash ? '⚠ 確認が必要! - ' + baseTitle : `🔴 あと ${fmtLeft()} - ` + baseTitle;
  }
}

function hideConfirm() {
  $('confirm-modal').hidden = true;
  clearInterval(cf.countTimer); cf.countTimer = null;
  clearInterval(cf.beepTimer); cf.beepTimer = null;
  if (note) { try { note.close(); } catch { /* 閉じていてよい */ } note = null; }
  if (cf.widget !== null && window.turnstile) { try { window.turnstile.remove(cf.widget); } catch { /* 消えていてよい */ } }
  Object.assign(cf, { id: null, widget: null, token: null });
  document.title = baseTitle;
}

async function showConfirm(p) {
  cf.id = p.id; cf.token = null;
  $('confirm-name').textContent = p.name;
  $('confirm-err').textContent = '';
  $('confirm-ok').disabled = !!cf.siteKey;
  $('confirm-modal').hidden = false;
  clearInterval(cf.countTimer); cf.countTimer = setInterval(tickCount, 1000);
  tickCount();
  beep(); clearInterval(cf.beepTimer); cf.beepTimer = setInterval(beep, 5000);
  notifyConfirm(p);
  if (cf.siteKey) {
    try {
      await loadTurnstile();
      if (cf.id !== p.id) return;
      $('ts-box').replaceChildren();
      cf.widget = window.turnstile.render('#ts-box', {
        sitekey: cf.siteKey, theme: 'dark',
        callback: (t) => { cf.token = t; $('confirm-ok').disabled = false; },
        'expired-callback': () => { cf.token = null; $('confirm-ok').disabled = true; },
      });
    } catch { $('confirm-err').textContent = '人かどうかの確認を読み込めませんでした。ページを開き直してください'; }
  }
}

// 一覧を作り直しても、確認ダイアログ(とその中のウィジェット)は作り直さない
function updateConfirm(projects, info) {
  if (info) cf.siteKey = info.turnstileSiteKey || '';
  const p = projects.find((x) => x.confirmSecondsLeft !== null && x.confirmSecondsLeft !== undefined);
  if (!p) { if (cf.id) hideConfirm(); return; }
  cf.deadline = Date.now() + p.confirmSecondsLeft * 1000;
  tickCount();
  if (cf.id !== p.id) showConfirm(p);
}

$('confirm-ok').onclick = async () => {
  $('confirm-err').textContent = '';
  $('confirm-ok').disabled = true;
  try {
    await api(`/projects/${cf.id}/keepalive`, { method: 'POST', body: { token: cf.token } });
    hideConfirm();
    await refresh();
  } catch (e) {
    $('confirm-err').textContent = e.message;
    if (window.turnstile && cf.widget !== null) { cf.token = null; try { window.turnstile.reset(cf.widget); } catch { /* 次の更新で作り直す */ } }
    else $('confirm-ok').disabled = false;
  }
};
$('confirm-stop').onclick = async () => {
  const id = cf.id;
  hideConfirm();
  if (id) await act(id, () => api(`/projects/${id}/stop`, { method: 'POST' }));
};

let timer = null;
async function refresh() {
  const projects = await api('/projects');
  let info = null;
  try {
    me = { ...me, ...(await (await fetch('/api/me', { credentials: 'same-origin' })).json()) };
    info = await api('/info');
    showUsage(info);
  } catch { /* 情報が取れなくても本体は動かす */ }
  // ビルドログの差分取得
  for (const p of projects) {
    const s = openLogs.get(p.id);
    if (s && s.type === 'build') {
      const r = await api(`/projects/${p.id}/build-log?offset=${s.offset}`);
      s.text += r.text; s.offset = r.offset;
    }
  }
  render(projects);
  tickTimers();
  updateConfirm(projects, info);
  for (const p of projects) { const b = $('log-' + p.id); if (b && !b.hidden) b.scrollTop = b.scrollHeight; }
  clearTimeout(timer);
  const active = projects.some((p) => p.status === 'building' || p.status === 'queued' || p.busy || p.confirmSecondsLeft != null);
  timer = setTimeout(() => refresh().catch(() => {}), active ? 1500 : 8000);
}

boot();
</script>
</body>
</html>
